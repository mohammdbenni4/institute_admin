<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#006c49" />
		<meta name="description" content="تطبيق المعلم - صرح القرآن" />
		<!-- Fonts are bundled (static/fonts + src/lib/fonts.css), never fetched: a missing
		     icon font used to render every icon as its literal ligature name. Preloading the
		     icon subset keeps the first paint free of icon pop-in. -->
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/material-symbols-0.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-surface-dim text-on-surface">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
